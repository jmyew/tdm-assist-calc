<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanco PK & Dose Adjust</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --adjust: #f39c12; --bg: #f4f7f6; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); padding: 10px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: 10px auto; }
        h2 { text-align: center; color: var(--primary); margin-top: 0; font-size: 1.4rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        label { font-size: 0.75rem; font-weight: bold; color: #7f8c8d; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; background: #fffde7; box-sizing: border-box; }
        button { width: 100%; padding: 15px; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .btn-calc { background: var(--accent); }
        .btn-reset { background: #95a5a6; margin-top: 10px; }
        .results { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; }
        .pk-results { background: #e8f5e9; border-left: 5px solid var(--accent); }
        .adj-results { background: #fff3e0; border-left: 5px solid var(--adjust); }
        .res-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .res-val { font-weight: bold; color: #2c3e50; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>Vancomycin (Pre & Post)</h2>
    
    <label>Current Regimen & Levels</label>
    <div class="grid" style="margin-top:5px;">
        <div><label>Pre Level</label><input type="number" id="pre" step="0.1" placeholder="mg/L"></div>
        <div><label>Post Level</label><input type="number" id="post" step="0.1" placeholder="mg/L"></div>
        <div><label>Dose (mg)</label><input type="number" id="dose"></div>
        <div><label>Interval (h)</label><input type="number" id="tau"></div>
        <div><label>Infusion (h)</label><input type="number" id="tinf" value="1"></div>
        <div><label>Weight (kg)</label><input type="number" id="wt" step="0.1"></div>
    </div>

    <label style="margin-top:10px; display:block;">Sampling Times</label>
    <div class="grid">
        <div><label>T-Post End to Samp</label><input type="number" id="tsamp" value="1"></div>
        <div><label>T-Pre to T-Post (h)</label><input type="number" id="tgap"></div>
    </div>

    <button class="btn-calc" onclick="runCalculations()">Calculate Everything</button>
    <button class="btn-reset" onclick="location.reload()">Reset App</button>

    <div id="pk_box" class="results pk-results">
        <label>Calculated PK Parameters</label>
        <div class="res-row"><span>Ke (h⁻¹)</span> <span class="res-val" id="ke_out"></span></div>
        <div class="res-row"><span>Vd (L/kg)</span> <span class="res-val" id="vd_out"></span></div>
        <div class="res-row"><span>Actual AUC24</span> <span class="res-val" id="auc_out"></span></div>
    </div>

    <hr>

    <label>New Dose Adjustment</label>
    <div class="grid" style="margin-top:5px;">
        <div><label>New Dose (mg)</label><input type="number" id="new_dose"></div>
        <div><label>New Interval (h)</label><input type="number" id="new_tau"></div>
    </div>

    <div id="adj_box" class="results adj-results">
        <label>Expected Values (New Dose)</label>
        <div class="res-row"><span>Expected Cmax</span> <span class="res-val" id="new_cmax"></span></div>
        <div class="res-row"><span>Expected Cmin</span> <span class="res-val" id="new_cmin"></span></div>
        <div class="res-row"><span>Expected AUC24</span> <span class="res-val" id="new_auc"></span></div>
    </div>
</div>

<script>
let globalKe = 0;
let globalVd = 0;

function runCalculations() {
    // Inputs
    const cPre = parseFloat(document.getElementById('pre').value);
    const cPost = parseFloat(document.getElementById('post').value);
    const dose = parseFloat(document.getElementById('dose').value);
    const tau = parseFloat(document.getElementById('tau').value);
    const tInf = parseFloat(document.getElementById('tinf').value);
    const tSamp = parseFloat(document.getElementById('tsamp').value);
    const tGap = parseFloat(document.getElementById('tgap').value);
    const wt = parseFloat(document.getElementById('wt').value);

    if (!cPre || !cPost || !tGap) return alert("Fill in current levels and T-gap");

    // 1. PK Calculation
    globalKe = Math.log(cPost / cPre) / tGap;
    // Cmax extrapolated to end of infusion
    const cMaxAct = cPost / Math.exp(-globalKe * tSamp);
    // Vd Calculation (Sawchuk-Zaske)
    globalVd = (dose / tInf) * (1 - Math.exp(-globalKe * tInf)) / (globalKe * (cMaxAct - (cPre * Math.exp(-globalKe * (tInf + (tau - tGap - tInf))))));

    // Display PK results
    document.getElementById('ke_out').innerText = globalKe.toFixed(4);
    document.getElementById('vd_out').innerText = (globalVd / wt).toFixed(2);
    document.getElementById('auc_out').innerText = ((dose * 24 / tau) / (globalKe * globalVd)).toFixed(1);
    document.getElementById('pk_box').style.display = 'block';

    // 2. Adjustment Prediction (if values are entered)
    const nDose = parseFloat(document.getElementById('new_dose').value);
    const nTau = parseFloat(document.getElementById('new_tau').value);

    if (nDose && nTau) {
        const nCmax = (nDose / tInf) * ((1 - Math.exp(-globalKe * tInf)) / (globalVd * globalKe * (1 - Math.exp(-globalKe * nTau))));
        const nCmin = nCmax * Math.exp(-globalKe * (nTau - tInf));
        const nAuc = (nDose * 24 / nTau) / (globalKe * globalVd);

        document.getElementById('new_cmax').innerText = nCmax.toFixed(2) + " mg/L";
        document.getElementById('new_cmin').innerText = nCmin.toFixed(2) + " mg/L";
        document.getElementById('new_auc').innerText = nAuc.toFixed(1);
        document.getElementById('adj_box').style.display = 'block';
    }
}
</script>

</body>
</html>
